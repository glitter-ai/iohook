name: CI

on:
  workflow_dispatch:
  push:
    tags: ['v*']

env:
  NODE_VERSION: 24

jobs:
  ci:
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: macos-15 # cross-compiles x64 via the ARCH env
            arch: x64
          - os: macos-15 # native arm64
            arch: arm64
          - os: windows-latest
            arch: x64
          - os: windows-11-arm
            arch: arm64
          - os: ubuntu-22.04 # glibc 2.35 baseline for broad prebuild compatibility
            arch: x64
          - os: ubuntu-22.04-arm # native arm64
            arch: arm64
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} (${{matrix.arch}})
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install setuptools for node-gyp (mac)
        if: startsWith(matrix.os, 'macos')
        run: python3 -m pip install --break-system-packages setuptools

      - name: Install X11 dev libraries (linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libx11-xcb-dev libxtst-dev libxt-dev libxinerama-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxkbfile-dev libxcb-xkb-dev libxcb1-dev

      - name: Install Packages
        run: npm i --ignore-scripts

      - name: Build Prebuild
        run: npm run build -- --msvs_version=2022
        env:
          ARCH: ${{ matrix.arch }}

      - name: Publish Prebuild to Release
        uses: softprops/action-gh-release@v2
        with:
          files: prebuilds/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
