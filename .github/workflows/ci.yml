name: CI

on:
  workflow_dispatch:
  push:
    tags: ['v*']

env:
  NODE_VERSION: 24

jobs:
  ci:
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: macos-13
            arch: x64
          - os: macos-13 # cross-compiles arm64 via the ARCH env
            arch: arm64
          - os: windows-latest
            arch: x64
          - os: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} (${{matrix.arch}})
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install setuptools for node-gyp (mac)
        if: matrix.os == 'macos-13'
        run: python3 -m pip install --break-system-packages setuptools

      - name: Install Packages
        run: npm i --ignore-scripts

      - name: Build Prebuild
        run: npm run build -- --msvs_version=2022
        env:
          ARCH: ${{ matrix.arch }}

      - name: Publish Prebuild to Release
        uses: softprops/action-gh-release@v2
        with:
          files: prebuilds/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
